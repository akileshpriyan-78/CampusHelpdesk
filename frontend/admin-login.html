<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Login - Campus Helpdesk</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f6f8;

    display: flex;
    justify-content: center;
    align-items: center;

    min-height: 100vh;
}

.login-box {
    width: 380px;
    background: white;
    padding: 35px;

    border-radius: 15px;

    box-shadow:
        0 5px 20px rgba(0,0,0,0.15);
}

.logo {
    text-align: center;
    font-size: 50px;
}

h1 {
    text-align: center;
    color: #172554;
    margin-bottom: 8px;
}

.subtitle {
    text-align: center;
    color: #777;
    margin-bottom: 25px;
}

label {
    display: block;
    margin-top: 15px;
    margin-bottom: 6px;
    font-weight: bold;
}

input {
    width: 100%;
    padding: 13px;

    border: 1px solid #ccc;
    border-radius: 7px;

    font-size: 15px;
}

input:focus {
    outline: none;
    border-color: #1976d2;
}

button {
    width: 100%;

    padding: 13px;
    margin-top: 25px;

    border: none;
    border-radius: 7px;

    background: #1976d2;
    color: white;

    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background: #125aa0;
}

#error {
    color: #d32f2f;
    text-align: center;
    margin-top: 15px;
}

.back {
    display: block;
    text-align: center;
    margin-top: 20px;

    color: #1976d2;
    text-decoration: none;
}

</style>

</head>


<body>


<div class="login-box">

    <div class="logo">
        🎓
    </div>

    <h1>Admin Login</h1>

    <div class="subtitle">
        Campus Helpdesk Administration
    </div>


    <label for="username">
        Username
    </label>

    <input
        type="text"
        id="username"
        placeholder="Enter admin username"
    >


    <label for="password">
        Password
    </label>

    <input
        type="password"
        id="password"
        placeholder="Enter admin password"
    >


    <button onclick="login()">
        🔐 Login
    </button>


    <div id="error"></div>


    <a class="back" href="index.html">
        ← Back to Chatbot
    </a>

</div>


<script>

async function login() {

    const username =
        document.getElementById("username").value.trim();

    const password =
        document.getElementById("password").value;


    const error =
        document.getElementById("error");


    error.innerText = "";


    if (username === "" || password === "") {

        error.innerText =
            "Please enter username and password.";

        return;
    }


    try {

        const response = await fetch(
            "http://127.0.0.1:8000/admin/login",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    username: username,
                    password: password
                })
            }
        );


        const data = await response.json();


        if (!response.ok) {

            error.innerText =
                data.detail ||
                "Invalid username or password.";

            return;
        }


        // Save login token
        localStorage.setItem(
            "adminToken",
            data.token
        );


        // Open dashboard
        window.location.href =
            "admin.html";

    }

    catch (error) {

        error.innerText =
            "Unable to connect to backend.";

    }

}

</script>


</body>

</html>
