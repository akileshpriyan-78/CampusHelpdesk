<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Campus Helpdesk</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 80%;
            max-width: 800px;
            margin: 60px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #333;
        }

        .status {
            text-align: center;
            margin: 20px 0;
            padding: 12px;
            background: #e8f5e9;
            color: #2e7d32;
            border-radius: 8px;
        }

        .chat-box {
            margin-top: 25px;
        }

        .input-area {
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            background: #1976d2;
            color: white;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #125aa0;
        }

        #response {
            margin-top: 20px;
            padding: 15px;
            background: #f1f1f1;
            border-radius: 8px;
            min-height: 50px;
            white-space: pre-wrap;
        }

        .admin-link {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: #1976d2;
            text-decoration: none;
            font-weight: bold;
        }

    </style>

</head>


<body>

<div class="container">

    <h1>🎓 Campus Helpdesk</h1>

    <div class="status">
        Backend Status:
        <strong>Connected</strong>
    </div>

    <div class="chat-box">

        <div class="input-area">

            <input
                type="text"
                id="question"
                placeholder="Ask your campus question..."
            >

            <button onclick="askQuestion()">
                Ask
            </button>

        </div>


        <div id="response">
            Response will appear here.
        </div>

    </div>


    <a class="admin-link"
       href="admin.html">

       🔐 Open Admin Dashboard

    </a>

</div>


<script>

let currentChatId = null;


async function askQuestion() {

    const question =
        document.getElementById("question").value;


    if (question.trim() === "") {

        alert("Please enter a question.");

        return;
    }


    document.getElementById("response").innerText =
        "Processing...";


    try {

        const response = await fetch(
            "http://127.0.0.1:8000/ask",
            {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    question: question
                })

            }
        );


        const data = await response.json();


        document.getElementById("response").innerText =
            data.answer;


        document.getElementById("question").value = "";


    } catch (error) {

        document.getElementById("response").innerText =
            "Unable to connect to backend.";

        console.error(error);

    }

}

</script>

</body>

</html>
